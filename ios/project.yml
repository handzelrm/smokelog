name: SmokeLog
options:
  bundleIdPrefix: com.smokelog
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
schemes:
  SmokeLog:
    build:
      targets:
        SmokeLog: all
    test:
      targets: [SmokeLogTests]
targets:
  SmokeLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SmokeLogTests]
    dependencies:
      - target: SmokeLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smokelog.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  SmokeLog:
    type: application
    platform: iOS
    sources: [SmokeLog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smokelog.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: SmokeLog/Resources/Info.plist
      properties:
        CFBundleDisplayName: SmokeLog
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Take photos of your cook (bark, smoke ring, slices) to keep with the log.
        LSSupportsOpeningDocumentsInPlace: false
        UISupportsDocumentBrowser: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: SmokeLog cook
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
